name: Deploy Prisma migrations to production

on:
  push:
    branches:
      - main
    paths:
      - "prisma/migrations/**"
      - "prisma/schema.prisma"
      - "prisma.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/prisma-migrate-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prisma-migrate-supabase-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate Supabase production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare migration database URL
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const value = process.env.DATABASE_URL;
            if (!value) throw new Error("The DATABASE_URL secret is missing or empty.");
            const url = new URL(value);
            if (!["postgres:", "postgresql:"].includes(url.protocol)) {
              throw new Error("DATABASE_URL must use the postgres:// or postgresql:// protocol.");
            }
            if (!url.hostname) throw new Error("DATABASE_URL must include a database host.");
            if (url.hostname.endsWith(".pooler.supabase.com") && url.port === "6543") {
              url.port = "5432";
            }
            url.searchParams.delete("pgbouncer");
            url.searchParams.delete("connection_limit");
            const directUrl = url.toString();
            console.log(`::add-mask::${directUrl}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `DIRECT_URL=${directUrl}\n`);
            console.log(`Prisma migrations will connect to ${url.hostname}:${url.port || "5432"}.`);
          '

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Apply pending migrations
        run: npm run db:postgres:migrate

      - name: Verify migration status
        run: npx prisma migrate status
